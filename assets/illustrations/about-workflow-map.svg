<svg width="1200" height="780" viewBox="0 0 1200 780" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="780" rx="40" fill="url(#bg)"/>
  <g opacity="0.55" filter="url(#blur)">
    <circle cx="220" cy="120" r="140" fill="#2563EB"/>
    <circle cx="980" cy="640" r="180" fill="#4F46E5"/>
  </g>
  <rect x="78" y="72" width="1044" height="636" rx="34" fill="rgba(15,23,42,0.72)" stroke="rgba(255,255,255,0.08)"/>
  <text x="118" y="142" fill="white" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700">Docuro AI Product Workflow</text>
  <text x="118" y="182" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="20">From invoice capture to GST-ready exports and multi-client review.</text>

  <path d="M220 318H980" stroke="url(#path)" stroke-width="6" stroke-linecap="round" stroke-dasharray="14 18"/>

  <g>
    <circle cx="220" cy="318" r="58" fill="url(#node1)"/>
    <text x="185" y="327" fill="white" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Upload</text>
    <rect x="124" y="414" width="192" height="118" rx="24" fill="#111C34"/>
    <rect x="146" y="438" width="88" height="12" rx="6" fill="#E2E8F0" fill-opacity="0.28"/>
    <rect x="146" y="464" width="126" height="12" rx="6" fill="#38BDF8"/>
    <rect x="146" y="490" width="92" height="12" rx="6" fill="#A78BFA"/>
    <text x="146" y="390" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Images, PDFs, WhatsApp bills</text>
  </g>

  <g>
    <circle cx="460" cy="318" r="58" fill="url(#node2)"/>
    <text x="430" y="327" fill="white" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">OCR</text>
    <rect x="364" y="414" width="192" height="118" rx="24" fill="#111C34"/>
    <rect x="392" y="438" width="58" height="58" rx="16" fill="url(#chip)"/>
    <text x="407" y="474" fill="white" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">AI</text>
    <rect x="466" y="440" width="62" height="10" rx="5" fill="#E2E8F0" fill-opacity="0.25"/>
    <rect x="466" y="462" width="74" height="10" rx="5" fill="#BFDBFE"/>
    <rect x="466" y="484" width="52" height="10" rx="5" fill="#86EFAC"/>
    <text x="388" y="390" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Fields, GSTIN, totals, dates</text>
  </g>

  <g>
    <circle cx="700" cy="318" r="58" fill="url(#node3)"/>
    <text x="658" y="327" fill="white" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Review</text>
    <rect x="604" y="414" width="192" height="118" rx="24" fill="#111C34"/>
    <rect x="628" y="438" width="144" height="18" rx="9" fill="#F59E0B" fill-opacity="0.18"/>
    <text x="644" y="451" fill="#FDE68A" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Pending human review</text>
    <rect x="628" y="470" width="144" height="18" rx="9" fill="#22C55E" fill-opacity="0.18"/>
    <text x="658" y="483" fill="#BBF7D0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Duplicate check clear</text>
    <rect x="628" y="502" width="144" height="10" rx="5" fill="#94A3B8" fill-opacity="0.3"/>
    <text x="622" y="390" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Confidence scores and checks</text>
  </g>

  <g>
    <circle cx="940" cy="318" r="58" fill="url(#node4)"/>
    <text x="901" y="327" fill="white" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Export</text>
    <rect x="844" y="414" width="192" height="118" rx="24" fill="#111C34"/>
    <rect x="868" y="438" width="144" height="28" rx="14" fill="url(#export)"/>
    <text x="897" y="457" fill="white" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Send to Tally</text>
    <rect x="868" y="480" width="144" height="12" rx="6" fill="#BFDBFE"/>
    <rect x="868" y="504" width="112" height="12" rx="6" fill="#A7F3D0"/>
    <text x="846" y="390" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Voucher output and GST reports</text>
  </g>

  <defs>
    <linearGradient id="bg" x1="90" y1="60" x2="1110" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111C34"/>
    </linearGradient>
    <linearGradient id="path" x1="220" y1="318" x2="980" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="node1" x1="162" y1="260" x2="278" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="node2" x1="402" y1="260" x2="518" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="node3" x1="642" y1="260" x2="758" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="node4" x1="882" y1="260" x2="998" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="chip" x1="392" y1="438" x2="450" y2="496" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="export" x1="868" y1="438" x2="1012" y2="466" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="blur" x="-60" y="-160" width="1500" height="1120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
