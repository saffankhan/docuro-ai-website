<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docuro AI Demo Preview</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(37, 99, 235, 0.25), transparent 35%),
          linear-gradient(135deg, #e8efff, #f8faff 55%, #ffffff);
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .frame {
        width: min(100%, 920px);
        aspect-ratio: 16 / 9;
        border-radius: 24px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
        background: #dbe7ff;
      }

      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: scale(1.03);
        animation: cycle 16s infinite;
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .slide:nth-child(2) {
        animation-delay: 4s;
      }

      .slide:nth-child(3) {
        animation-delay: 8s;
      }

      .slide:nth-child(4) {
        animation-delay: 12s;
      }

      .overlay {
        position: absolute;
        left: 20px;
        right: 20px;
        bottom: 20px;
        z-index: 2;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 18px;
        padding: 18px 20px;
        border-radius: 20px;
        background: rgba(15, 23, 42, 0.58);
        color: #fff;
        backdrop-filter: blur(10px);
      }

      .eyebrow {
        display: inline-flex;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0 6px;
        font-size: clamp(22px, 4vw, 34px);
        line-height: 1.08;
      }

      p {
        margin: 0;
        max-width: 44ch;
        color: rgba(255, 255, 255, 0.82);
      }

      .pulse {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.14);
        font-size: 28px;
        animation: pulse 1.8s ease-in-out infinite;
      }

      @keyframes cycle {
        0%,
        20% {
          opacity: 1;
          transform: scale(1);
        }
        25%,
        100% {
          opacity: 0;
          transform: scale(1.03);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.08);
        }
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="slide"><img src="./assets/images/invoice-upload.png" alt="Invoice upload demo" /></div>
      <div class="slide"><img src="./assets/images/ca-workspace.png" alt="CA workspace demo" /></div>
      <div class="slide"><img src="./assets/images/gst-dashboard.png" alt="GST dashboard demo" /></div>
      <div class="slide"><img src="./assets/images/tally-export.png" alt="Tally export demo" /></div>
      <div class="overlay">
        <div>
          <span class="eyebrow">Docuro AI Demo</span>
          <h1>Invoice to GST to Tally, in one AI-driven flow.</h1>
          <p>Preview the product journey while the full interactive walkthrough opens from the landing page.</p>
        </div>
        <div class="pulse">&#9658;</div>
      </div>
    </div>
  </body>
</html>
